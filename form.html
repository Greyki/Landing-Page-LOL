<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Contenedor principal -->
    <div class="container container-principal">
        <!-- Contenedor superior -->
        <div class="container-superior">
            <h1>Registro de Usuario</h1>
            <p>Completa el formulario para registrarte</p>
        </div>
        <!-- Contenedor inferior -->
        <div class="container-inferior">
            <form>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <input type="text" class="form-control" id="nombre" required>
                </div>
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <div class="mb-3">
                    <label for="fecha" class="form-label">Fecha de nacimiento</label>
                    <input type="date" class="form-control" id="fecha" required>
                </div>
                <div class="mb-3">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Género</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="genero" id="masculino">
                                <label class="form-check-label" for="masculino">Masculino</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="genero" id="femenino">
                                <label class="form-check-label" for="femenino">Femenino</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="genero" id="otro">
                                <label class="form-check-label" for="otro">Otro</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="genero" id="prefiero-no-especificar">
                                <label class="form-check-label" for="prefiero-no-especificar">Prefiero no especificar</label>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                                <label class="form-label">Intereses</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="juegos">
                                    <label class="form-check-label" for="juegos">Videojuegos</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="tecnologia">
                                    <label class="form-check-label" for="tecnologia">Tecnología</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="musica">
                                    <label class="form-check-label" for="musica">Música</label>
                                </div>
                               <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="deportes">
                                    <label class="form-check-label" for="deportes">Deportes</label>
                                </div>  
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="comentarios" class="form-label">Comentarios</label>
                    <textarea class="form-control" id="comentarios" rows="4"></textarea>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="terminos" required>
                    <label class="form-check-label" for="terminos">Acepto los términos y condiciones</label>
                </div>
                <div class="contenedor-boton">
                    <button type="submit" class="btn btn-primary">Registrarse</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
